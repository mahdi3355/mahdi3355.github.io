<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#080d14">
  <meta name="description" content="کارت مخاطب دیجیتال مهدی دربندی؛ اطلاعات تماس و شبکه‌های اجتماعی.">
  <meta name="author" content="مهدی دربندی">

  <meta property="og:type" content="profile">
  <meta property="og:title" content="مهدی دربندی | Digital Contact Plate">
  <meta property="og:description" content="کارت مخاطب دیجیتال مهدی دربندی؛ اسکن، ذخیره و ارتباط.">
  <meta property="og:url" content="https://mahdi3355.github.io/">
  <meta property="og:image" content="https://mahdi3355.github.io/profile.jpg">
  <meta property="og:image:alt" content="تصویر پروفایل مهدی دربندی">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="مهدی دربندی | Digital Contact Plate">
  <meta name="twitter:description" content="کارت مخاطب دیجیتال مهدی دربندی">

  <link rel="preload" as="image" href="profile.jpg">

  <title>مهدی دربندی | Digital Contact Plate</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #080d14;
      --bg-soft: #0d141d;
      --card: rgba(16, 24, 34, 0.88);
      --card-border: rgba(188, 145, 74, 0.24);
      --bronze: #c79a58;
      --bronze-light: #e2bd7c;
      --bronze-dark: #8c6532;
      --cream: #f3efe6;
      --ink: #0e1013;
      --text: #f1eee8;
      --muted: #8f99a5;
      --line: rgba(255, 255, 255, 0.075);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(120, 91, 47, 0.13), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(27, 52, 78, 0.18), transparent 32%),
        var(--bg);
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 450px;
    }

    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 30px 26px 22px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.035), transparent 38%),
        var(--card);
      box-shadow:
        0 30px 80px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(16px);
      animation: cardIn .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .card::before {
      width: 180px;
      height: 180px;
      top: -100px;
      left: -90px;
      border: 1px solid rgba(199,154,88,.12);
      border-radius: 50%;
    }

    .card::after {
      width: 110px;
      height: 1px;
      right: 26px;
      top: 24px;
      background: linear-gradient(90deg, transparent, var(--bronze));
      opacity: .65;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 17px;
      padding: 3px;
      border: 1px solid rgba(226,189,124,.5);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--bronze-light), var(--bronze-dark));
      box-shadow:
        0 10px 30px rgba(0,0,0,.3),
        0 0 26px rgba(199,154,88,.1);
      animation: avatarIn .8s cubic-bezier(.2,.8,.2,1) .08s both;
    }

    .profile-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes avatarIn {
      from {
        opacity: 0;
        transform: scale(.86);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--bronze-light);
      font: 500 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--bronze-dark);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 36px);
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .latin-name {
      margin-top: 7px;
      color: var(--muted);
      direction: ltr;
      font: 500 13px/1.4 Georgia, 'Times New Roman', serif;
      letter-spacing: 3.5px;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 19px auto 0;
      width: 90px;
    }

    .ornament span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze-dark));
    }

    .ornament span:last-child {
      background: linear-gradient(90deg, var(--bronze-dark), transparent);
    }

    .ornament i {
      width: 5px;
      height: 5px;
      transform: rotate(45deg);
      background: var(--bronze);
    }

    /* QR */

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-frame {
      position: relative;
      display: inline-flex;
      animation: qrPulse 2.8s ease-in-out infinite;
      padding: 16px;
      background: var(--cream);
      box-shadow:
        0 0 0 1px rgba(199,154,88,.35),
        0 0 28px rgba(199,154,88,.17),
        0 14px 35px rgba(0,0,0,.35);
    }

    @keyframes qrPulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(199,154,88,.35),
          0 0 22px rgba(199,154,88,.13),
          0 14px 35px rgba(0,0,0,.35);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(199,154,88,.5),
          0 0 34px rgba(199,154,88,.24),
          0 14px 35px rgba(0,0,0,.35);
      }
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 190px;
      height: 190px;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 190px !important;
      height: 190px !important;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--bronze-light);
      box-shadow: 0 0 8px rgba(226,189,124,.25);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .corner.tl {
      top: -5px;
      left: -5px;
    }

    .corner.tr {
      top: -5px;
      right: -5px;
      transform: rotate(90deg);
    }

    .corner.br {
      bottom: -5px;
      right: -5px;
      transform: rotate(180deg);
    }

    .corner.bl {
      bottom: -5px;
      left: -5px;
      transform: rotate(270deg);
    }

    .qr-hint {
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    /* Contacts */

    .contacts {
      display: grid;
      gap: 10px;
      margin-top: 25px;
    }

    .contact-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 64px;
      padding: 11px 14px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
      cursor: pointer;
    }

    .contact-row:hover {
      border-color: rgba(199,154,88,.7);
      background: rgba(199,154,88,.055);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .contact-row:active {
      transform: translateY(0);
    }

    .contact-icon {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--bronze-light);
      border: 1px solid rgba(199,154,88,.28);
      border-radius: 10px;
      background: rgba(199,154,88,.07);
      font-size: 17px;
    }

    .contact-icon svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .contact-info {
      min-width: 0;
      flex: 1;
    }

    .contact-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .contact-value {
      display: block;
      direction: ltr;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--bronze-light);
      font-size: 11px;
    }

    .contact-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      border: 1px solid rgba(199,154,88,.2);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      cursor: pointer;
      font: 14px/1 inherit;
      transition: .2s ease;
    }

    .copy-btn:hover {
      color: var(--bronze-light);
      border-color: rgba(199,154,88,.55);
      background: rgba(199,154,88,.08);
    }

    .contact-arrow {
      direction: ltr;
      color: var(--bronze-dark);
      font-family: monospace;
      font-size: 17px;
      transition: color .25s ease, transform .25s ease;
    }

    .contact-row:hover .contact-arrow {
      color: var(--bronze-light);
      transform: translateX(-2px);
    }

    .social-icon.instagram {
      color: #e7b96e;
    }

    .social-icon.telegram {
      color: #62b9e9;
    }

    /* Phone unlocked buttons */

    .phone-tools {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-right: 4px;
      flex-shrink: 0;
    }

    .phone-tool {
      height: 32px;
      padding: 0 10px;
      border: 1px solid rgba(199,154,88,.22);
      border-radius: 8px;
      color: var(--bronze-light);
      background: rgba(199,154,88,.05);
      cursor: pointer;
      font: 600 10px/1 inherit;
      white-space: nowrap;
      transition: .2s ease;
    }

    .phone-tool:hover {
      border-color: rgba(199,154,88,.6);
      background: rgba(199,154,88,.1);
      transform: translateY(-1px);
    }

    .phone-unlocked {
      animation: phoneUnlock .55s ease;
    }

    @keyframes phoneUnlock {
      from {
        opacity: .35;
        transform: scale(.98);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Quick actions */

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .quick-btn {
      min-height: 48px;
      border: 1px solid rgba(199,154,88,.24);
      border-radius: 12px;
      color: var(--bronze-light);
      background: rgba(199,154,88,.045);
      cursor: pointer;
      font: 600 12px/1.4 inherit;
      transition: .2s ease;
    }

    .quick-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(199,154,88,.6);
      background: rgba(199,154,88,.08);
    }

    /* Toast */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10000;
      padding: 10px 15px;
      color: var(--text);
      border: 1px solid rgba(199,154,88,.35);
      border-radius: 10px;
      background: #101821;
      box-shadow: 0 14px 35px rgba(0,0,0,.35);
      font-size: 11px;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Footer */

    .footer {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      direction: ltr;
      text-align: center;
      color: #68727e;
      font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.5px;
    }

    /* PIN Modal */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,5,9,.72);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity .25s ease,
        visibility .25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: min(100%, 350px);
      padding: 28px 24px 23px;
      text-align: center;
      border: 1px solid rgba(199,154,88,.35);
      border-radius: 19px;
      background: #101821;
      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 35px rgba(199,154,88,.08);
      transform: translateY(15px) scale(.97);
      transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal-lock {
      margin-bottom: 13px;
      font-size: 28px;
    }

    .modal h2 {
      margin: 0;
      font-size: 19px;
    }

    .modal p {
      margin: 8px 0 18px;
      color: var(--muted);
      font-size: 11px;
    }

    .pin-input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      direction: ltr;
      text-align: center;
      color: var(--text);
      outline: none;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 11px;
      background: rgba(0,0,0,.25);
      font: 700 20px monospace;
      letter-spacing: 8px;
      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .pin-input:focus {
      border-color: var(--bronze);
      box-shadow: 0 0 0 3px rgba(199,154,88,.1);
    }

    .error {
      min-height: 19px;
      margin-top: 8px;
      color: #df8d7e;
      font-size: 11px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .modal-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: .2s ease;
    }

    .confirm-btn {
      border: 1px solid var(--bronze);
      color: #111;
      background: var(--bronze-light);
    }

    .confirm-btn:hover {
      background: #efd095;
    }

    .cancel-btn {
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
    }

    .cancel-btn:hover {
      color: var(--text);
      border-color: rgba(255,255,255,.2);
    }

    .shake {
      animation: shake .35s ease;
    }

    @keyframes shake {
      20% { transform: translateX(7px); }
      40% { transform: translateX(-7px); }
      60% { transform: translateX(5px); }
      80% { transform: translateX(-4px); }
    }

    /* Love modal */

    #loveModal {
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3,8,15,.82);
      backdrop-filter: blur(7px);
      padding: 20px;
    }

    #loveModal.show {
      display: flex;
    }

    .love-box {
      width: min(420px,92vw);
      padding: 30px 24px 24px;
      border: 1px solid rgba(212,175,104,.55);
      border-radius: 24px;
      background: linear-gradient(145deg,#17202d,#0d141e);
      box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        0 0 35px rgba(212,175,104,.12);
      text-align: center;
      color: #fff;
      direction: rtl;
    }

    .love-box h3 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .love-box p {
      margin: 0 0 24px;
      color: #c9cbd0;
    }

    .love-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      min-height: 58px;
    }

    .love-actions button {
      border: 0;
      border-radius: 14px;
      padding: 12px 24px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    #loveYes {
      background: #d4af68;
      color: #111;
      box-shadow: 0 8px 25px rgba(212,175,104,.25);
    }

    #loveNo {
      background: #252d39;
      color: #fff;
      border: 1px solid #46505d;
    }

    #loveYes:hover,
    #loveNo:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
        align-items: flex-start;
      }

      .card {
        margin-top: 8px;
        padding: 25px 18px 19px;
        border-radius: 20px;
      }

      #qrcode,
      #qrcode img,
      #qrcode canvas {
        width: 174px !important;
        height: 174px !important;
      }

      .qr-frame {
        padding: 14px;
      }

      h1 {
        font-size: 29px;
      }

      .phone-tools {
        gap: 4px;
      }

      .phone-tool {
        padding: 0 7px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <header class="header">

        <div class="profile-avatar">
          <img
            src="profile.jpg"
            alt="مهدی دربندی"
            width="112"
            height="112"
          >
        </div>

        <div class="eyebrow">
          Digital Contact Plate
        </div>

        <h1>
          مهدی دربندی
        </h1>

        <div class="latin-name">
          MEHDI DARBANDI
        </div>

        <div class="ornament" aria-hidden="true">
          <span></span>
          <i></i>
          <span></span>
        </div>

      </header>


      <!-- QR -->

      <section class="qr-section" aria-label="QR Code">

        <div class="qr-frame">

          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner br"></div>
          <div class="corner bl"></div>

          <div id="qrcode"></div>

        </div>

        <p class="qr-hint">
          اسکن کن تا وارد این صفحه بشی و همه اطلاعات رو ببینی
        </p>

      </section>


      <!-- Contacts -->

      <section class="contacts" aria-label="اطلاعات تماس">

        <!-- PHONE -->

        <div
          id="phoneRow"
          class="contact-row locked"
          role="button"
          tabindex="0"
          aria-label="باز کردن شماره تلفن"
          onclick="openPinModal()"
          onkeydown="
            if(event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openPinModal();
            }
          "
        >

          <div class="contact-icon">
            🔒
          </div>

          <div class="contact-info">

            <span class="contact-label">
              تلفن
            </span>

            <span
              id="phoneValue"
              class="contact-value lock-badge"
            >
              🔒 قفل
            </span>

          </div>

          <span class="contact-arrow">
            ›
          </span>

        </div>


        <!-- INSTAGRAM -->

        <a
          class="contact-row"
          href="https://instagram.com/mahdi_darbandy"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="اینستاگرام مهدی دربندی"
        >

          <div class="contact-icon social-icon instagram">

            <svg
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />

              <circle
                cx="12"
                cy="12"
                r="4.2"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              />

              <circle
                cx="17.5"
                cy="6.5"
                r="1.2"
                fill="currentColor"
              />
            </svg>

          </div>

          <div class="contact-info">

            <span class="contact-label">
              اینستاگرام
            </span>

            <span class="contact-value">
              Instagram
            </span>

          </div>

          <div class="contact-actions">

            <button

        <!-- TELEGRAM -->

        <a
          class="contact-row"

            <svg

            >

              <path
                d="M21.5 3.5 3.7 10.35c-1.22.47-1.21 1.13-.22 1.42l4.56 1.42 1.75 5.43c.22.61.11.85.74.85.49 0 .71-.22.98-.48l2.2-2.14 4.57 3.37c.84.46 1.45.22 1.66-.78l3-14.16c.31-1.2-.46-1.74-1.44-1.39ZM9.02 12.84l9.98-6.3c.5-.3.95-.14.58.19l-8.3 7.5-.32 3.38-1.94-4.77Z"
                fill="currentColor"
              />

          <div class="contact-info">

  </main>


  <!-- Toast -->

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>


  <!-- PIN MODAL -->

  <div
    id="pinModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    onclick="overlayClick(event)"
  >

    <div class="modal">

      <div class="modal-lock">
        🔐
      </div>

      <h2 id="modalTitle">شماره تلفن قفل است</h2>
<p>رمزشو می‌خوای شیطون؟ 😏❤️</p>

      <input
        id="pinInput"
        class="pin-input"
        type="password"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        placeholder="••••"
        aria-label="رمز چهار رقمی"
        oninput="this.value=this.value.replace(/\D/g,'').slice(0,4)"
        onkeydown="if(event.key === 'Enter') checkPin()"
      >

      <div
        id="pinError"
        class="error"
        aria-live="polite"
      ></div>

      <div class="modal-actions">

        <button
          class="modal-btn cancel-btn"
          type="button"
          onclick="closePinModal()"
        >
          انصراف
        </button>

        <button
          class="modal-btn confirm-btn"
          type="button"
          onclick="checkPin()"
        >
          تأیید
        </button>

      </div>

    </div>

  </div>


  <!-- QR CODE LIBRARY -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <script>

    /* =====================================================
       PHONE SETTINGS
       ===================================================== */

    const PHONE = "+989141209514";

    const QR_URL =
      "https://mahdi3355.github.io/";

    /* رمز تلفن */
    const PIN = "3576";


    /* =====================================================
       QR CODE
       ===================================================== */

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: QR_URL,
        width: 190,
        height: 190,
        colorDark: "#0e1013",
        colorLight: "#f3efe6",
        correctLevel: QRCode.CorrectLevel.H
      }
    );


    /* =====================================================
       PHONE ELEMENTS
       ===================================================== */

    const modal =
      document.getElementById("pinModal");

    const pinInput =
      document.getElementById("pinInput");

    const pinError =
      document.getElementById("pinError");

    const phoneRow =
      document.getElementById("phoneRow");


    let pinSuccessAction = "call";


    /* =====================================================
       OPEN PHONE PIN
       ===================================================== */

    function openPinModal(action = "call") {

      /*
        اگر قبلاً رمز درست وارد شده،
        دوباره رمز نمی‌خواهد.
      */

      if (
        phoneRow.dataset.unlocked === "true"
      ) {

        if (action === "save") {

          downloadVCard();

        } else {

          callPhone();

        }

        return;
      }


      pinSuccessAction = action;

      modal.classList.add("active");

      pinError.textContent = "";

      pinInput.value = "";

      document.body.style.overflow = "hidden";

      setTimeout(() => {

        pinInput.focus();

      }, 180);

    }


    /* =====================================================
       CLOSE PIN MODAL
       ===================================================== */

    function closePinModal() {

      modal.classList.remove("active");

      document.body.style.overflow = "";

      pinInput.value = "";

      pinError.textContent = "";

    }


    /* =====================================================
       CLICK OUTSIDE MODAL
       ===================================================== */

    function overlayClick(event) {

      if (event.target === modal) {

        closePinModal();

      }

    }


    /* =====================================================
       CHECK PIN
       ===================================================== */

    function checkPin() {

      if (pinInput.value === PIN) {

        unlockPhone();

        closePinModal();


        /*
          اگر کاربر از دکمه ذخیره مخاطب آمده،
          بعد از رمز مستقیم فایل را ذخیره کن.
        */

        if (
          pinSuccessAction === "save"
        ) {

          setTimeout(() => {

            downloadVCard();

          }, 150);

        }

      } else {

        pinError.textContent =
          "رمز اشتباه است";

        pinInput.classList.remove("shake");

        void pinInput.offsetWidth;

        pinInput.classList.add("shake");

        pinInput.select();

      }

    }


    /* =====================================================
       UNLOCK PHONE
       ===================================================== */

    function unlockPhone() {

      phoneRow.dataset.unlocked = "true";

      phoneRow.classList.remove("locked");

      phoneRow.classList.add("phone-unlocked");

      phoneRow.setAttribute(
        "role",
        "group"
      );

      phoneRow.setAttribute(
        "aria-label",
        "شماره تلفن باز شد"
      );


      /* تغییر قفل به تلفن */

      const icon =
        phoneRow.querySelector(".contact-icon");

      if (icon) {

        icon.textContent = "☎";

      }


      /* نمایش شماره */

      const value =
        phoneRow.querySelector(".contact-value");

      if (value) {

        value.textContent = PHONE;

        value.classList.remove(
          "lock-badge"
        );

      }


      /* فلش */

      const arrow =
        phoneRow.querySelector(".contact-arrow");

      if (arrow) {

        arrow.textContent = "›";

      }


      /*
        دکمه‌های تماس و ذخیره
      */

      if (
        !phoneRow.querySelector(".phone-tools")
      ) {

        const tools =
          document.createElement("div");

        tools.className =
          "phone-tools";

        tools.innerHTML = `

          <button
            class="phone-tool"
            type="button"
            onclick="event.stopPropagation(); callPhone()"
          >
            📞 تماس
          </button>

          <button
            class="phone-tool"
            type="button"
            onclick="event.stopPropagation(); downloadVCard()"
          >
            💾 ذخیره
          </button>

        `;

        phoneRow.appendChild(tools);

      }


      /*
        کلیک روی خود کارت تلفن
        = تماس
      */

      phoneRow.onclick =
        function(event) {

          if (
            event.target.closest(
              ".phone-tool"
            )
          ) {

            return;

          }

          callPhone();

        };


      phoneRow.onkeydown =
        function(event) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            callPhone();

          }

        };

    }


    /* =====================================================
       CALL PHONE
       ===================================================== */

    function callPhone() {

      window.location.href =
        "tel:" + PHONE;

    }


    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(message) {

      const toast =
        document.getElementById("toast");

      toast.textContent = message;

      toast.classList.add("show");

      clearTimeout(
        window.__toastTimer
      );

      window.__toastTimer =
        setTimeout(() => {

          toast.classList.remove("show");

        }, 1800);

    }


    /* =====================================================
       COPY TEXT
       ===================================================== */

    async function copyText(
      text,
      event
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();

      }


      try {

        await navigator.clipboard.writeText(
          text
        );

        showToast(
          "کپی شد ✓"
        );

      } catch {

        const area =
          document.createElement("textarea");

        area.value = text;

        document.body.appendChild(area);

        area.select();

        document.execCommand("copy");

        area.remove();

        showToast(
          "کپی شد ✓"
        );

      }

    }


    /* =====================================================
       SAVE CONTACT BUTTON
       ===================================================== */

    function saveContact() {

      /*
        اگر شماره قفل است،
        اول رمز می‌خواهد.
      */

      if (
        phoneRow.dataset.unlocked !== "true"
      ) {

        openPinModal("save");

        return;

      }


      downloadVCard();

    }


    /* =====================================================
       DOWNLOAD VCARD
       ===================================================== */

    function downloadVCard() {

      const vcard = [

        "BEGIN:VCARD",

        "VERSION:3.0",

        "FN:مهدی دربندی",

        "N:دربندی;مهدی;;;",

        "TEL;TYPE=CELL:+989141209514",

        "URL:https://instagram.com/mahdi_darbandy",

        "URL:https://t.me/mahdidarbandy",

        "END:VCARD"

      ].join("\r\n");


      const blob =
        new Blob(
          ["\ufeff" + vcard],
          {
            type:
              "text/vcard;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "mehdi-darbandi.vcf";

      document.body.appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(url);


      showToast(
        "فایل مخاطب آماده شد ✓"
      );

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async function sharePage() {

      const shareData = {

        title:
          "مهدی دربندی | Digital Contact Plate",

        text:
          "کارت مخاطب دیجیتال مهدی دربندی",

        url:
          QR_URL

      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        } catch (error) {}

      } else {

        await copyText(
          QR_URL
        );

        showToast(
          "لینک صفحه کپی شد ✓"
        );

      }

    }


    /* =====================================================
       ESCAPE
       ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains("active")
        ) {

          closePinModal();

        }

      }
    );

  </script>


  <!-- LOVE MODAL -->

  <div
    id="loveModal"
    aria-hidden="true"
  >

    <div
      class="love-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loveTitle"
    >

      <h3 id="loveTitle">
        یک سؤال کوچولو 🥹❤️
      </h3>

      <p>
        قبل از اینکه بریم ادامه بدیم 😄
      </p>

      <div class="love-actions">

        <button
          id="loveNo"
          type="button"
        >
          نه 😅
        </button>

        <button
          id="loveYes"
          type="button"
        >
          آره ❤️
        </button>

      </div>

    </div>

  </div>


  <script>

    /*
      Love modal
      بدون نقش‌آفرینی عاشقانه.
    */

    (function() {

      const modal =
        document.getElementById(
          "loveModal"
        );

      const yes =
        document.getElementById(
          "loveYes"
        );

      const no =
        document.getElementById(
          "loveNo"
        );

      let yesScale = 1;


      function openLove(url) {

        modal.classList.add("show");

        modal.setAttribute(
          "aria-hidden",
          "false"
        );

        modal.dataset.url =
          url || "";

        yesScale = 1;

        yes.style.transform =
          "scale(1)";

        yes.style.fontSize = "";

        yes.style.padding = "";

        no.style.transform =
          "scale(1)";

      }


      function closeAndGo() {

        const url =
          modal.dataset.url;

        modal.classList.remove(
          "show"
        );

        modal.setAttribute(
          "aria-hidden",
          "true"
        );

        if (url) {

          window.location.href =
            url;

        }

      }


      yes.addEventListener(
        "click",
        closeAndGo
      );


      no.addEventListener(
        "click",
        function() {

          yesScale =
            Math.min(
              yesScale * 1.35,
              5.5
            );

          yes.style.transform =
            "scale(" +
            yesScale +
            ")";

          yes.style.fontSize =
            Math.min(
              16 * yesScale,
              52
            ) + "px";

          yes.style.padding =
            Math.min(
              12 * yesScale,
              42
            ) +
            "px " +
            Math.min(
              24 * yesScale,
              70
            ) +
            "px";

          no.style.transform =
            "scale(" +
            Math.max(
              1 / Math.sqrt(yesScale),
              .55
            ) +
            ")";

        }
      );


      /*
        Instagram / Telegram
      */

      document.addEventListener(
        "click",
        function(e) {

          const el =
            e.target.closest(
              "a,button"
            );

          if (!el) return;

          const text =
            (
              el.textContent || ""
            ).toLowerCase();

          const href =
            el.getAttribute(
              "href"
            ) || "";

          const combined =
            text + " " + href;

          const isSocial =
            /instagram|telegram|اینستاگرام|تلگرام|@mahdi/i
              .test(combined);

          if (!isSocial) return;

          if (
            el.closest("#loveModal")
          ) return;

          e.preventDefault();

          openLove(href);

        },
        true
      );

    })();

  </script>
