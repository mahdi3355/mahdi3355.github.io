<head>

  <link rel="preload" as="image" href="profile.jpg">

  <title>مهدی دربندی | Digital Contact Plate</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #080d14;
      --bg-soft: #0d141d;
      --card: rgba(16, 24, 34, 0.88);
      --card-border: rgba(188, 145, 74, 0.24);
      --bronze: #c79a58;
      --bronze-light: #e2bd7c;
      --bronze-dark: #8c6532;
      --cream: #f3efe6;
      --ink: #0e1013;
      --text: #f1eee8;
      --muted: #8f99a5;
      --line: rgba(255, 255, 255, 0.075);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      color: var(--text);
      background:
        radial-gradient(circle at 50% 0%, rgba(120, 91, 47, 0.13), transparent 34%),
        radial-gradient(circle at 0% 100%, rgba(27, 52, 78, 0.18), transparent 32%),
        var(--bg);
      font-family: "Vazirmatn", Tahoma, sans-serif;
    }

    .page {
      width: 100%;
      max-width: 450px;
    }

    .card {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 30px 26px 22px;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.035), transparent 38%),
        var(--card);
      box-shadow:
        0 30px 80px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(16px);
      animation: cardIn .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .card::before {
      width: 180px;
      height: 180px;
      top: -100px;
      left: -90px;
      border: 1px solid rgba(199,154,88,.12);
      border-radius: 50%;
    }

    .card::after {
      width: 110px;
      height: 1px;
      right: 26px;
      top: 24px;
      background: linear-gradient(90deg, transparent, var(--bronze));
      opacity: .65;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .profile-avatar {
      width: 112px;
      height: 112px;
      margin: 0 auto 17px;
      padding: 3px;
      border: 1px solid rgba(226,189,124,.5);
      border-radius: 50%;
      background: linear-gradient(145deg, var(--bronze-light), var(--bronze-dark));
      box-shadow:
        0 10px 30px rgba(0,0,0,.3),
        0 0 26px rgba(199,154,88,.1);
      animation: avatarIn .8s cubic-bezier(.2,.8,.2,1) .08s both;
    }

    .profile-avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes avatarIn {
      from {
        opacity: 0;
        transform: scale(.86);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--bronze-light);
      font: 500 10px/1.2 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .eyebrow::before,
    .eyebrow::after {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--bronze-dark);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 8vw, 36px);
      line-height: 1.35;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .latin-name {
      margin-top: 7px;
      color: var(--muted);
      direction: ltr;
      font: 500 13px/1.4 Georgia, 'Times New Roman', serif;
      letter-spacing: 3.5px;
    }

    .ornament {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 19px auto 0;
      width: 90px;
    }

    .ornament span {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze-dark));
    }

    .ornament span:last-child {
      background: linear-gradient(90deg, var(--bronze-dark), transparent);
    }

    .ornament i {
      width: 5px;
      height: 5px;
      transform: rotate(45deg);
      background: var(--bronze);
    }

    /* QR */

    .qr-section {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .qr-frame {
      position: relative;
      display: inline-flex;
      animation: qrPulse 2.8s ease-in-out infinite;
      padding: 16px;
      background: var(--cream);
      box-shadow:
        0 0 0 1px rgba(199,154,88,.35),
        0 0 28px rgba(199,154,88,.17),
        0 14px 35px rgba(0,0,0,.35);
    }

    @keyframes qrPulse {
      0%, 100% {
        box-shadow:
          0 0 0 1px rgba(199,154,88,.35),
          0 0 22px rgba(199,154,88,.13),
          0 14px 35px rgba(0,0,0,.35);
      }

      50% {
        box-shadow:
          0 0 0 1px rgba(199,154,88,.5),
          0 0 34px rgba(199,154,88,.24),
          0 14px 35px rgba(0,0,0,.35);
      }
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 190px;
      height: 190px;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 190px !important;
      height: 190px !important;
    }

    .corner {
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
    }

    .corner::before,
    .corner::after {
      content: "";
      position: absolute;
      background: var(--bronze-light);
      box-shadow: 0 0 8px rgba(226,189,124,.25);
    }

    .corner::before {
      width: 100%;
      height: 2px;
    }

    .corner::after {
      width: 2px;
      height: 100%;
    }

    .corner.tl {
      top: -5px;
      left: -5px;
    }

    .corner.tr {
      top: -5px;
      right: -5px;
      transform: rotate(90deg);
    }

    .corner.br {
      bottom: -5px;
      right: -5px;
      transform: rotate(180deg);
    }

    .corner.bl {
      bottom: -5px;
      left: -5px;
      transform: rotate(270deg);
    }

    .qr-hint {
      margin: 14px 0 0;
      color: var(--muted);
      text-align: center;
      font-size: 11px;
      line-height: 1.8;
    }

    /* Contacts */

    .contacts {
      display: grid;
      gap: 10px;
      margin-top: 25px;
    }

    .contact-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 64px;
      padding: 11px 14px;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,.025);
      transition:
        border-color .25s ease,
        background .25s ease,
        transform .25s ease,
        box-shadow .25s ease;
      cursor: pointer;
    }

    .contact-row:hover {
      border-color: rgba(199,154,88,.7);
      background: rgba(199,154,88,.055);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    .contact-row:active {
      transform: translateY(0);
    }

    .contact-icon {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: var(--bronze-light);
      border: 1px solid rgba(199,154,88,.28);
      border-radius: 10px;
      background: rgba(199,154,88,.07);
      font-size: 17px;
      transition: .35s ease;
    }

    .contact-icon svg {
      width: 21px;
      height: 21px;
      display: block;
    }

    .contact-info {
      min-width: 0;
      flex: 1;
    }

    .contact-label {
      display: block;
      margin-bottom: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .contact-value {
      display: block;
      direction: ltr;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 600;
    }

    .lock-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--bronze-light);
      font-size: 11px;
    }

    .contact-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .copy-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 32px;
      border: 1px solid rgba(199,154,88,.2);
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
      cursor: pointer;
      font: 14px/1 inherit;
      transition: .2s ease;
    }

    .copy-btn:hover {
      color: var(--bronze-light);
      border-color: rgba(199,154,88,.55);
      background: rgba(199,154,88,.08);
    }

    .contact-arrow {
      direction: ltr;
      color: var(--bronze-dark);
      font-family: monospace;
      font-size: 17px;
      transition: color .25s ease, transform .25s ease;
    }

    .contact-row:hover .contact-arrow {
      color: var(--bronze-light);
      transform: translateX(-2px);
    }

    .social-icon.instagram {
      color: #e7b96e;
    }

    .social-icon.telegram {
      color: #62b9e9;
    }

    /* Phone unlocked */

    .phone-tools {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-right: 3px;
      flex-shrink: 0;
    }

    .phone-tool {
      height: 32px;
      padding: 0 8px;
      border: 1px solid rgba(199,154,88,.22);
      border-radius: 8px;
      color: var(--bronze-light);
      background: rgba(199,154,88,.05);
      cursor: pointer;
      font: 600 9px/1 inherit;
      white-space: nowrap;
      transition: .2s ease;
    }

    .phone-tool:hover {
      border-color: rgba(199,154,88,.6);
      background: rgba(199,154,88,.1);
      transform: translateY(-1px);
    }

    .phone-unlocked {
      animation: phoneUnlock .65s ease;
    }

    @keyframes phoneUnlock {
      0% {
        opacity: .35;
        transform: scale(.97);
      }

      55% {
        transform: scale(1.015);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Quick actions */

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 12px;
    }

    .quick-btn {
      min-height: 48px;
      border: 1px solid rgba(199,154,88,.24);
      border-radius: 12px;
      color: var(--bronze-light);
      background: rgba(199,154,88,.045);
      cursor: pointer;
      font: 600 12px/1.4 inherit;
      transition: .2s ease;
    }

    .quick-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(199,154,88,.6);
      background: rgba(199,154,88,.08);
    }

    /* Toast */

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10000;
      padding: 10px 15px;
      color: var(--text);
      border: 1px solid rgba(199,154,88,.35);
      border-radius: 10px;
      background: #101821;
      box-shadow: 0 14px 35px rgba(0,0,0,.35);
      font-size: 11px;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Footer */

    .footer {
      margin-top: 22px;
      padding-top: 17px;
      border-top: 1px solid var(--line);
      direction: ltr;
      text-align: center;
      color: #68727e;
      font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 1.5px;
    }

    /* =========================
       PIN MODAL
       ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(2,5,9,.76);
      backdrop-filter: blur(12px);
      opacity: 0;
      visibility: hidden;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: min(100%, 350px);
      padding: 28px 24px 24px;
      text-align: center;
      border: 1px solid rgba(199,154,88,.38);
      border-radius: 20px;
      background:
        linear-gradient(145deg, rgba(255,255,255,.035), transparent 45%),
        #101821;
      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        0 0 40px rgba(199,154,88,.1);
      transform: translateY(15px) scale(.96);
      transition: transform .3s cubic-bezier(.2,.8,.2,1);
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal-lock {
      margin-bottom: 13px;
      font-size: 30px;
      transition: transform .35s ease;
    }

    .modal.unlocking .modal-lock,
    .modal.success .modal-lock {
      animation: unlockIcon .65s ease;
    }

    @keyframes unlockIcon {
      0%   { transform: rotate(0) scale(1); }
      25%  { transform: rotate(-12deg) scale(1.08); }
      50%  { transform: rotate(12deg) scale(1.15); }
      75%  { transform: rotate(-5deg) scale(1.08); }
      100% { transform: rotate(0) scale(1); }
    }

    .modal h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .modal p {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 11px;
    }

    .pin-dots {
      display: flex;
      direction: ltr;
      justify-content: center;
      gap: 13px;
      margin: 4px 0 8px;
      cursor: text;
    }

    .pin-dot {
      width: 15px;
      height: 15px;
      border: 1px solid rgba(199,154,88,.42);
      border-radius: 50%;
      background: transparent;
      transition:
        background .18s ease,
        border-color .18s ease,
        transform .18s ease,
        box-shadow .18s ease;
    }

    .pin-dot.filled {
      border-color: var(--bronze-light);
      background: var(--bronze-light);
      box-shadow: 0 0 13px rgba(226,189,124,.35);
      transform: scale(1.08);
    }

    .pin-dot.wrong {
      border-color: #df8d7e;
      background: #df8d7e;
      box-shadow: 0 0 12px rgba(223,141,126,.25);
    }

    .pin-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .error {
      min-height: 36px;
      margin-top: 8px;
      color: #df8d7e;
      font-size: 11px;
      line-height: 1.7;
    }

    .error.show {
      animation: errorIn .25s ease;
    }

    @keyframes errorIn {
      from {
        opacity: 0;
        transform: translateY(-3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .modal-btn {
      flex: 1;
      height: 42px;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      transition: .2s ease;
    }

    .confirm-btn {
      border: 1px solid var(--bronze);
      color: #111;
      background: var(--bronze-light);
    }

    .confirm-btn:hover {
      background: #efd095;
      transform: translateY(-1px);
    }

    .cancel-btn {
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
    }

    .cancel-btn:hover {
      color: var(--text);
      border-color: rgba(255,255,255,.2);
    }

    .pin-shake {
      animation: pinShake .4s ease;
    }

    @keyframes pinShake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(7px); }
      40% { transform: translateX(-7px); }
      60% { transform: translateX(5px); }
      80% { transform: translateX(-4px); }
    }

    .modal.success .pin-dot {
      border-color: #9bd39b;
      background: #9bd39b;
      box-shadow: 0 0 13px rgba(155,211,155,.3);
    }

    /* Love modal */

    #loveModal {
      position: fixed;
      inset: 0;
      z-index: 10001;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3,8,15,.82);
      backdrop-filter: blur(7px);
      padding: 20px;
    }

    #loveModal.show {
      display: flex;
    }

    .love-box {
      width: min(420px,92vw);
      padding: 30px 24px 24px;
      border: 1px solid rgba(212,175,104,.55);
      border-radius: 24px;
      background: linear-gradient(145deg,#17202d,#0d141e);
      box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        0 0 35px rgba(212,175,104,.12);
      text-align: center;
      color: #fff;
      direction: rtl;
    }

    .love-box h3 {
      margin: 0 0 10px;
      font-size: 26px;
    }

    .love-box p {
      margin: 0 0 24px;
      color: #c9cbd0;
    }

    .love-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      min-height: 58px;
    }

    .love-actions button {
      border: 0;
      border-radius: 14px;
      padding: 12px 24px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform .18s ease,
        box-shadow .18s ease;
    }

    #loveYes {
      background: #d4af68;
      color: #111;
      box-shadow: 0 8px 25px rgba(212,175,104,.25);
    }

    #loveNo {
      background: #252d39;
      color: #fff;
      border: 1px solid #46505d;
    }

    #loveYes:hover,
    #loveNo:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 480px) {

      body {
        padding: 14px;
        align-items: flex-start;
      }

      .card {
        margin-top: 8px;
        padding: 25px 18px 19px;
        border-radius: 20px;
      }

      #qrcode,
      #qrcode img,
      #qrcode canvas {
        width: 174px !important;
        height: 174px !important;
      }

      .qr-frame {
        padding: 14px;
      }

      h1 {
        font-size: 29px;
      }

      .phone-tools {
        gap: 3px;
      }

      .phone-tool {
        padding: 0 6px;
        font-size: 8px;
      }

      .pin-dot {
        width: 14px;
        height: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <header class="header">

        <div class="profile-avatar">
          <img
            src="profile.jpg"
            alt="مهدی دربندی"
            width="112"
            height="112"
          >
        </div>

        <div class="eyebrow">
          Digital Contact Plate
        </div>

        <h1>
          مهدی دربندی
        </h1>

        <div class="latin-name">
          MEHDI DARBANDI
        </div>

        <div class="ornament" aria-hidden="true">
          <span></span>
          <i></i>
          <span></span>
        </div>

      </header>

      <!-- QR -->

      <section class="qr-section" aria-label="QR Code">

        <div class="qr-frame">

          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner br"></div>
          <div class="corner bl"></div>

          <div id="qrcode"></div>

        </div>

        <p class="qr-hint">
          اسکن کن تا وارد این صفحه بشی و همه اطلاعات رو ببینی
        </p>

      </section>

      <!-- Contacts -->

      <section class="contacts" aria-label="اطلاعات تماس">

        <!-- PHONE -->

        <div
          id="phoneRow"
          class="contact-row locked"
          role="button"
          tabindex="0"
          aria-label="باز کردن شماره تلفن"
          onclick="openPinModal()"

  <!-- Toast -->

  <div
    id="toast"

  <!-- PIN MODAL -->

  <div
    id="pinModal"
    class="modal-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
    onclick="overlayClick(event)"
  >

    <div class="modal">

      <div
        id="modalLock"
        class="modal-lock"
      >
        🔐
      </div>

      <h2 id="modalTitle">
        شماره تلفن قفل است
      </h2>

      <p id="modalHint">
        رمزشو می‌خوای شیطون؟ 😏❤️
      </p>

      <!-- PIN DOTS -->

      <div
        id="pinDots"
        class="pin-dots"
        onclick="focusPin()"
        aria-label="رمز چهار رقمی"
      >

        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>

      </div>

      <input
        id="pinInput"
        class="pin-input"
        type="tel"
        inputmode="numeric"
        maxlength="4"
        autocomplete="off"
        aria-label="رمز چهار رقمی"
        oninput="handlePinInput()"
        onkeydown="if(event.key === 'Enter') checkPin()"
      >

      <div
        id="pinError"
        class="error"
        aria-live="polite"
      ></div>

      <div class="modal-actions">

        <button
          class="modal-btn cancel-btn"
          type="button"
          onclick="closePinModal()"
        >
          انصراف
        </button>

        <button
          class="modal-btn confirm-btn"
          type="button"
          onclick="checkPin()"
        >
          تأیید
        </button>

      </div>

    </div>

  <!-- QR CODE LIBRARY -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>

    /* =====================================================
       SETTINGS
       ===================================================== */

    const PHONE = "+989141209514";

    const QR_URL =
      "https://mahdi3355.github.io/";

    /* رمز تلفن */

    const PIN = "3576";


    /* =====================================================
       QR CODE
       ===================================================== */

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: QR_URL,
        width: 190,
        height: 190,
        colorDark: "#0e1013",
        colorLight: "#f3efe6",
        correctLevel: QRCode.CorrectLevel.H
      }
    );


    /* =====================================================
       PHONE ELEMENTS
       ===================================================== */

    const modal =
      document.getElementById("pinModal");

    const pinInput =
      document.getElementById("pinInput");

    const pinError =
      document.getElementById("pinError");

    const phoneRow =
      document.getElementById("phoneRow");

    const pinDots =
      document.querySelectorAll(".pin-dot");

    const modalHint =
      document.getElementById("modalHint");

    const modalLock =
      document.getElementById("modalLock");

    const modalTitle =
      document.getElementById("modalTitle");


    let pinSuccessAction = "call";

    let pinAttempts = 0;


    /* =====================================================
       WRONG PIN MESSAGES
       ===================================================== */

    const wrongMessages = [

      "نه نه 😏 دوباره فکر کن!",

      "نزدیک بود... ولی نه 😈",

      "این که رمز نیست شیطون 😂🔐",

      "داری شانستو امتحان می‌کنی؟ 😂",

      "اوه اوه... هنوز پیداش نکردی؟ 😏",

      "فکر کنم باید از صاحب شماره بپرسی 😌🔐"

    ];


    /* =====================================================
       OPEN PIN MODAL
       ===================================================== */

    function openPinModal(
      action = "call"
    ) {

      /*
        اگر قبلاً رمز درست وارد شده،
        دوباره رمز نمی‌خواهد.
      */

      if (
        phoneRow.dataset.unlocked === "true"
      ) {

        if (action === "save") {

          downloadVCard();

        } else {

          callPhone();

        }

        return;

      }


      pinSuccessAction = action;

      pinAttempts = 0;


      modal.classList.remove(
        "success",
        "pin-shake"
      );


      modalLock.textContent =
        "🔐";


      modalTitle.textContent =
        "شماره تلفن قفل است";


      modalHint.textContent =
        "رمزشو می‌خوای شیطون؟ 😏❤️";


      pinError.textContent =
        "";

      pinError.classList.remove(
        "show"
      );


      pinInput.value =
        "";


      updatePinDots();


      modal.classList.add(
        "active"
      );


      document.body.style.overflow =
        "hidden";


      setTimeout(() => {

        pinInput.focus();

      }, 180);

    }


    /* =====================================================
       CLOSE MODAL
       ===================================================== */

    function closePinModal() {

      modal.classList.remove(
        "active"
      );


      document.body.style.overflow =
        "";


      pinInput.value =
        "";


      pinError.textContent =
        "";


      updatePinDots();

    }


    /* =====================================================
       FOCUS PIN
       ===================================================== */

    function focusPin() {

      pinInput.focus();

    }


    /* =====================================================
       UPDATE PIN DOTS
       ===================================================== */

    function updatePinDots() {

      const length =
        pinInput.value.length;


      pinDots.forEach(
        (dot, index) => {

          dot.classList.toggle(
            "filled",
            index < length
          );

          dot.classList.remove(
            "wrong"
          );

        }
      );

    }


    /* =====================================================
       PIN INPUT
       ===================================================== */

    function handlePinInput() {

      pinInput.value =
        pinInput.value
          .replace(/\D/g, "")
          .slice(0, 4);


      updatePinDots();


      if (
        pinInput.value.length === 4
      ) {

        setTimeout(() => {

          checkPin();

        }, 100);

      }

    }


    /* =====================================================
       WRONG PIN
       ===================================================== */

    function showWrongPin() {

      const messageIndex =
        Math.min(
          pinAttempts - 1,
          wrongMessages.length - 1
        );


      pinError.textContent =
        wrongMessages[
          messageIndex
        ];


      pinError.classList.remove(
        "show"
      );


      void pinError.offsetWidth;


      pinError.classList.add(
        "show"
      );


      pinDots.forEach(
        dot => {

          dot.classList.add(
            "wrong"
          );

        }
      );


      modal.classList.remove(
        "pin-shake"
      );


      void modal.offsetWidth;


      modal.classList.add(
        "pin-shake"
      );


      setTimeout(() => {

        pinInput.value =
          "";

        updatePinDots();

        pinInput.focus();

      }, 450);

    }


    /* =====================================================
       CHECK PIN
       ===================================================== */

    function checkPin() {

      if (
        pinInput.value.length !== 4
      ) {

        pinError.textContent =
          "چهار رقم رمز رو وارد کن 😏";

        pinError.classList.add(
          "show"
        );

        pinInput.focus();

        return;

      }


      /* رمز صحیح */

      if (
        pinInput.value === PIN
      ) {

        modal.classList.add(
          "success"
        );


        modalLock.textContent =
          "🔓";


        pinDots.forEach(
          dot => {

            dot.classList.add(
              "filled"
            );

          }
        );


        modalTitle.textContent =
          "دسترسی تأیید شد ✓";


        modalHint.textContent =
          "بالاخره پیداش کردی 😏❤️";


        pinError.textContent =
          "";


        setTimeout(() => {

          unlockPhone();

          closePinModal();


          if (
            pinSuccessAction === "save"
          ) {

            setTimeout(() => {

              downloadVCard();

            }, 150);

          }

        }, 800);


      } else {

        /* رمز اشتباه */

        pinAttempts++;

        showWrongPin();

      }

    }


    /* =====================================================
       OVERLAY CLICK
       ===================================================== */

    function overlayClick(event) {

      if (
        event.target === modal
      ) {

        closePinModal();

      }

    }


    /* =====================================================
       UNLOCK PHONE
       ===================================================== */

    function unlockPhone() {

      phoneRow.dataset.unlocked =
        "true";


      phoneRow.classList.remove(
        "locked"
      );


      phoneRow.classList.add(
        "phone-unlocked"
      );


      phoneRow.setAttribute(
        "role",
        "group"
      );


      phoneRow.setAttribute(
        "aria-label",
        "شماره تلفن باز شد"
      );


      /* تغییر قفل به تلفن */

      const icon =
        phoneRow.querySelector(
          ".contact-icon"
        );


      if (icon) {

        icon.textContent =
          "☎";

      }


      /* نمایش شماره */

      const value =
        phoneRow.querySelector(
          ".contact-value"
        );


      if (value) {

        value.textContent =
          PHONE;


        value.classList.remove(
          "lock-badge"
        );

      }


      /* فلش */

      const arrow =
        phoneRow.querySelector(
          ".contact-arrow"
        );


      if (arrow) {

        arrow.textContent =
          "›";

      }


      /* ابزارها */

      if (
        !phoneRow.querySelector(
          ".phone-tools"
        )
      ) {

        const tools =
          document.createElement(
            "div"
          );


        tools.className =
          "phone-tools";


        tools.innerHTML = `

          <button
            class="phone-tool"
            type="button"
            onclick="event.stopPropagation(); callPhone()"
          >
            📞 تماس
          </button>

          <button
            class="phone-tool"
            type="button"
            onclick="event.stopPropagation(); copyText(PHONE)"
          >
            📋 کپی
          </button>

          <button
            class="phone-tool"
            type="button"
            onclick="event.stopPropagation(); downloadVCard()"
          >
            💾 ذخیره
          </button>

        `;


        phoneRow.appendChild(
          tools
        );

      }


      /*
        کلیک روی کارت بعد از باز شدن
        = تماس
      */

      phoneRow.onclick =
        function(event) {

          if (
            event.target.closest(
              ".phone-tool"
            )
          ) {

            return;

          }


          callPhone();

        };


      phoneRow.onkeydown =
        function(event) {

          if (
            event.key === "Enter" ||
            event.key === " "
          ) {

            event.preventDefault();

            callPhone();

          }

        };

    }


    /* =====================================================
       CALL
       ===================================================== */

    function callPhone() {

      window.location.href =
        "tel:" + PHONE;

    }


    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(
      message
    ) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent =
        message;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        window.__toastTimer
      );


      window.__toastTimer =
        setTimeout(() => {

          toast.classList.remove(
            "show"
          );

        }, 1800);

    }


    /* =====================================================
       COPY TEXT
       ===================================================== */

    async function copyText(
      text,
      event
    ) {

      if (event) {

        event.preventDefault();

        event.stopPropagation();

      }


      try {

        await navigator.clipboard.writeText(
          text
        );


        showToast(
          "کپی شد ✓"
        );


      } catch {

        const area =
          document.createElement(
            "textarea"
          );


        area.value =
          text;


        document.body.appendChild(
          area
        );


        area.select();


        document.execCommand(
          "copy"
        );


        area.remove();


        showToast(
          "کپی شد ✓"
        );

      }

    }


    /* =====================================================
       SAVE CONTACT
       ===================================================== */

    function saveContact() {

      if (
        phoneRow.dataset.unlocked !==
        "true"
      ) {

        openPinModal(
          "save"
        );

        return;

      }


      downloadVCard();

    }


    /* =====================================================
       VCARD
       ===================================================== */

    function downloadVCard() {

      const vcard = [

        "BEGIN:VCARD",

        "VERSION:3.0",

        "FN:مهدی دربندی",

        "N:دربندی;مهدی;;;",

        "TEL;TYPE=CELL:+989141209514",

        "URL:https://instagram.com/mahdi_darbandy",

        "URL:https://t.me/mahdidarbandy",

        "END:VCARD"

      ].join(
        "\r\n"
      );


      const blob =
        new Blob(
          ["\ufeff" + vcard],
          {
            type:
              "text/vcard;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        "mehdi-darbandi.vcf";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      URL.revokeObjectURL(
        url
      );


      showToast(
        "مخاطب آماده شد ✓"
      );

    }


    /* =====================================================
       SHARE
       ===================================================== */

    async function sharePage() {

      const shareData = {

        title:
          "مهدی دربندی | Digital Contact Plate",

        text:
          "کارت مخاطب دیجیتال مهدی دربندی",

        url:
          QR_URL

      };


      if (
        navigator.share
      ) {

        try {

          await navigator.share(
            shareData
          );

        } catch (error) {}

      } else {

        await copyText(
          QR_URL
        );

        showToast(
          "لینک صفحه کپی شد ✓"
        );

      }

    }


    /* =====================================================
       ESCAPE
       ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          modal.classList.contains(
            "active"
          )
        ) {

          closePinModal();

        }

      }
    );

  </script>

  <!-- LOVE MODAL -->

  <div
    id="loveModal"
    aria-hidden="true"
  >

    <div
      class="love-box"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loveTitle"
    >

      <h3 id="loveTitle">
        یک سؤال کوچولو 🥹❤️
      </h3>

      <p>
        قبل از اینکه بریم ادامه بدیم 😄
      </p>

      <div class="love-actions">

        <button
          id="loveNo"
          type="button"
        >
          نه 😅
        </button>

        <button
          id="loveYes"
          type="button"
        >
          آره ❤️
        </button>

      </div>

    </div>

  </div>

  <script>

    /*
      Love modal
    */

    (function() {

      const modal =
        document.getElementById(
          "loveModal"
        );

      const yes =
        document.getElementById(
          "loveYes"
        );

      const no =
        document.getElementById(
          "loveNo"
        );

      let yesScale = 1;


      function openLove(url) {

        modal.classList.add(
          "show"
        );

        modal.setAttribute(
          "aria-hidden",
          "false"
        );

        modal.dataset.url =
          url || "";

        yesScale = 1;

        yes.style.transform =
          "scale(1)";

        yes.style.fontSize =
          "";

        yes.style.padding =
          "";

        no.style.transform =
          "scale(1)";

      }


      function closeAndGo() {

        const url =
          modal.dataset.url;


        modal.classList.remove(
          "show"
        );


        modal.setAttribute(
          "aria-hidden",
          "true"
        );


        if (url) {

          window.location.href =
            url;

        }

      }


      yes.addEventListener(
        "click",
        closeAndGo
      );


      no.addEventListener(
        "click",
        function() {

          yesScale =
            Math.min(
              yesScale * 1.35,
              5.5
            );


          yes.style.transform =
            "scale(" +
            yesScale +
            ")";


          yes.style.fontSize =
            Math.min(
              16 * yesScale,
              52
            ) + "px";


          yes.style.padding =
            Math.min(
              12 * yesScale,
              42
            ) +
            "px " +
            Math.min(
              24 * yesScale,
              70
            ) +
            "px";


          no.style.transform =
            "scale(" +
            Math.max(
              1 / Math.sqrt(
                yesScale
              ),
              .55
            ) +
            ")";

        }
      );


      /* Instagram / Telegram */

      document.addEventListener(
        "click",
        function(e) {

          const el =
            e.target.closest(
              "a,button"
            );


          if (!el) return;


          const text =
            (
              el.textContent || ""
            ).toLowerCase();


          const href =
            el.getAttribute(
              "href"
            ) || "";


          const combined =
            text +
            " " +
            href;


          const isSocial =
            /instagram|telegram|اینستاگرام|تلگرام|@mahdi/i
              .test(
                combined
              );


          if (!isSocial) return;


          if (
            el.closest(
              "#loveModal"
            )
          ) return;


          e.preventDefault();


          openLove(
            href
          );

        },
        true
      );

    })();

  </script>
